# Installed alongside the Pi-side CNC preflight component.
# Start/Resume approval is single-use, short-lived and bound to current zeros.
[gcode_macro _CNC_PREFLIGHT_STATE]
variable_start_approved: 0
variable_resume_approved: 0
variable_filename: ""
variable_offset_x: 0.0
variable_offset_y: 0.0
variable_offset_z: 0.0
variable_machine_x: 0.0
variable_machine_y: 0.0
variable_machine_z: 0.0
variable_expires: 0.0
gcode:
  G4 P0

[gcode_macro _CNC_PREFLIGHT_REQUIRE]
gcode:
  {% set gate = printer['gcode_macro _CNC_PREFLIGHT_STATE'] %}
  {% set kind = params.KIND|default('')|upper %}
  {% set g = printer.gcode_move %}
  {% set t = printer.toolhead %}
  {% if kind not in ['START','RESUME'] %}
    {action_raise_error('Unknown preflight action')}
  {% endif %}
  {% if (kind == 'START' and not gate.start_approved) or (kind == 'RESUME' and not gate.resume_approved) %}
    {action_raise_error('Use CNC Pendant: stage and verify the file before Start or Resume')}
  {% endif %}
  {% if t.homed_axes != 'xyz' or t.estimated_print_time > gate.expires %}
    {action_raise_error('Preflight expired or homing changed; verify again')}
  {% endif %}
  {% for axis in ['x','y','z'] %}
    {% if (g.position[axis] - gate['machine_' + axis])|abs > 0.00001 or (g.position[axis] - g.gcode_position[axis] - gate['offset_' + axis])|abs > 0.00001 %}
      {action_raise_error('Position or work zero changed; verify again')}
    {% endif %}
  {% endfor %}
  {% if kind == 'START' and params.FILENAME|default('') != gate.filename %}
    {action_raise_error('The selected filename changed; verify again')}
  {% endif %}
  {% if kind == 'START' and printer.pause_resume.is_paused %}
    {action_raise_error('Cancel the paused job before starting a new file')}
  {% endif %}
  {% if kind == 'RESUME' and not printer.pause_resume.is_paused %}
    {action_raise_error('No paused job to resume')}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_CNC_PREFLIGHT_STATE VARIABLE={kind|lower}_approved VALUE=0
