# Reference only: review hardware, macro conflicts and paths before enabling.
# Requires an existing [save_variables] configuration. Include once.
# Persist the actual override, restore no higher than 100% after Klipper restart.
[gcode_macro M220]
rename_existing: M220.1
gcode:
  M220.1 {rawparams}
  {% if 'S' in params %}
    SAVE_VARIABLE VARIABLE=cnc_run_speed VALUE={params.S|float}
  {% endif %}

[delayed_gcode cnc_restore_run_speed]
initial_duration: 1.5
gcode:
  {% set saved = printer.save_variables.variables.cnc_run_speed|default(100)|float %}
  M220 S{[saved, 100.0]|min}

# Moonraker and Mainsail start files using this command. Resume bypasses it.
[gcode_macro SDCARD_PRINT_FILE]
rename_existing: SDCARD_PRINT_FILE_CNC_BASE
gcode:
  _CNC_PREFLIGHT_REQUIRE KIND=START FILENAME="{params.FILENAME}"
  START_JOB
  SDCARD_PRINT_FILE_CNC_BASE {rawparams}
