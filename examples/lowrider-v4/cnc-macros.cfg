# Reference only: review hardware, macro conflicts and paths before enabling.
# LowRider CNC macros. Router mains power remains manually controlled until a
# properly rated, isolated contactor/relay and independent E-stop are installed.

# Mainsail PAUSE customization for CNC use. Capture the current XY position so
# the stock park helper raises Z first but does not traverse the gantry.
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos: True
variable_custom_park_x: 0.0
variable_custom_park_y: 0.0
variable_custom_park_dz: 10.0
variable_speed_hop: 15.0
variable_user_pause_macro: "CNC_PAUSE_CAPTURE_XY"
variable_user_resume_macro: "CNC_RESUME_ORDERED"
gcode:
  G4 P0

[gcode_macro CNC_PAUSE_CAPTURE_XY]
description: Preserve current XY so PAUSE only lifts Z
gcode:
  {% set pos = printer.gcode_move.gcode_position %}
  SET_GCODE_VARIABLE MACRO=_CLIENT_VARIABLE VARIABLE=custom_park_x VALUE={pos.x}
  SET_GCODE_VARIABLE MACRO=_CLIENT_VARIABLE VARIABLE=custom_park_y VALUE={pos.y}

# Home Z/Z1 upward first, then single-motor X to MIN, then Y/Y1 to MIN.
# An axis-specific horizontal home still homes Z first for clearance.
[gcode_macro G28]
description: Home Z MAX first, then requested X/Y axes to MIN
rename_existing: G28.1
gcode:
  LED_ON
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
  G28.1 Z
  {% if home_all or 'X' in params %}
    G28.1 X
  {% endif %}
  {% if home_all or 'Y' in params %}
    G28.1 Y
  {% endif %}

[gcode_macro M0]
description: Pause a CNC job
gcode:
  PAUSE

[gcode_macro CONTINUE_CUT]
description: Resume a paused CNC job
gcode:
  RESUME

[gcode_macro CHECK_ENDSTOPS]
description: Report all physical endstop states
gcode:
  QUERY_ENDSTOPS

[gcode_macro HOME_Z]
description: Home the Z and Z1 motors to their individual endstops
gcode:
  G28 Z

[gcode_macro HOME_X]
description: Home Z for clearance, then single-motor X to X minimum (0 mm)
gcode:
  G28 X

[gcode_macro HOME_Y]
description: Home Z for clearance, then Y and Y1 to Y minimum (0 mm)
gcode:
  G28 Y

[gcode_macro HOME_ZX]
description: Home Z and Z1 first, then home X; Y is not moved
gcode:
  G28 X

[gcode_macro HOME_ALL]
description: Home Z MAX first, then X MIN, then Y and Y1 MIN
gcode:
  G28

[gcode_macro ZERO_X]
description: Set the current X work position to zero
gcode:
  {% if printer.pause_resume.is_paused %}
    {action_raise_error("Do not re-zero X/Y while paused: this may spoil the workpiece or crash the machine")}
  {% endif %}
  G92 X0

[gcode_macro ZERO_Y]
description: Set the current Y work position to zero
gcode:
  {% if printer.pause_resume.is_paused %}
    {action_raise_error("Do not re-zero X/Y while paused: this may spoil the workpiece or crash the machine")}
  {% endif %}
  G92 Y0

[gcode_macro ZERO_XY]
description: Set the current X and Y work positions to zero
gcode:
  {% if printer.pause_resume.is_paused %}
    {action_raise_error("Do not re-zero X/Y while paused: this may spoil the workpiece or crash the machine")}
  {% endif %}
  G92 X0 Y0

[gcode_macro ZERO_Z]
description: Set the current Z work position to zero
gcode:
  SET_GCODE_VARIABLE MACRO=_CNC_PREFLIGHT_STATE VARIABLE=resume_approved VALUE=0
  G92 Z0

[gcode_macro ZERO_ALL]
description: Set the current XYZ work position to zero
gcode:
  {% if printer.pause_resume.is_paused %}
    {action_raise_error("Do not re-zero X/Y while paused: this may spoil the workpiece or crash the machine")}
  {% endif %}
  G92 X0 Y0 Z0

[gcode_macro START_JOB]
description: CNC job-start hook; router start remains manual
gcode:
  {% set percent = printer.gcode_move.speed_factor|float * 100.0 %}
  M220 S{[percent, 100.0]|min}
  M117 CNC job started

[gcode_macro END_JOB]
description: CNC job-end hook; router stop remains manual
gcode:
  M400
  M117 CNC job complete

# M3/M5 and touch-plate probing are intentionally withheld until the router
# control hardware, probe input, polarity, and safe shutdown behavior are tested.

# Capture every pause, including PAUSE_BASE emitted by the CNC post.
[gcode_macro PAUSE_BASE]
rename_existing: CNC_PAUSE_BASE_ORIGINAL
variable_valid: False
variable_origin_x: 0.0
variable_origin_y: 0.0
variable_machine_x: 0.0
variable_machine_y: 0.0
variable_work_z: 0.0
variable_feed: 300.0
variable_factor: 1.0
variable_absolute: True
variable_file_position: -1
gcode:
  {% if not printer.pause_resume.is_paused %}
    {% set g = printer.gcode_move %}
    SET_GCODE_VARIABLE MACRO=PAUSE_BASE VARIABLE=origin_x VALUE={g.position.x - g.gcode_position.x}
    SET_GCODE_VARIABLE MACRO=PAUSE_BASE VARIABLE=origin_y VALUE={g.position.y - g.gcode_position.y}
    SET_GCODE_VARIABLE MACRO=PAUSE_BASE VARIABLE=machine_x VALUE={g.position.x}
    SET_GCODE_VARIABLE MACRO=PAUSE_BASE VARIABLE=machine_y VALUE={g.position.y}
    SET_GCODE_VARIABLE MACRO=PAUSE_BASE VARIABLE=work_z VALUE={g.gcode_position.z}
    SET_GCODE_VARIABLE MACRO=PAUSE_BASE VARIABLE=feed VALUE={g.speed}
    SET_GCODE_VARIABLE MACRO=PAUSE_BASE VARIABLE=factor VALUE={g.speed_factor}
    SET_GCODE_VARIABLE MACRO=PAUSE_BASE VARIABLE=absolute VALUE={g.absolute_coordinates}
    SET_GCODE_VARIABLE MACRO=PAUSE_BASE VARIABLE=valid VALUE=True
    SET_GCODE_VARIABLE MACRO=PAUSE_BASE VARIABLE=file_position VALUE={printer.virtual_sdcard.file_position|int if printer.virtual_sdcard.file_size|int > 0 else -1}
  {% endif %}
  CNC_PAUSE_BASE_ORIGINAL

[gcode_macro CNC_RESUME_ORDERED]
description: Lift, return XY, lower Z; preserve current tool Z zero
gcode:
  _CNC_PREFLIGHT_REQUIRE KIND=RESUME
  {% set pause = printer['gcode_macro PAUSE_BASE'] %}
  {% set g = printer.gcode_move %}
  {% if not printer.pause_resume.is_paused or not pause.valid %}
    {action_raise_error("Ordered resume has no captured pause position")}
  {% endif %}
  {% if 'xyz' not in printer.toolhead.homed_axes %}
    {action_raise_error("Ordered resume requires all axes homed")}
  {% endif %}
  # position - gcode_position includes both G92 and SET_GCODE_OFFSET.
  {% set bx = g.position.x - g.gcode_position.x %}
  {% set by = g.position.y - g.gcode_position.y %}
  {% set bz = g.position.z - g.gcode_position.z %}
  {% set tx = pause.machine_x - bx %}
  {% set ty = pause.machine_y - by %}
  {% set safe_z = [g.gcode_position.z, pause.work_z + 10.0, 10.0]|max %}
  {% set zmax = printer.toolhead.axis_maximum.z - bz %}
  {% set zmin = printer.toolhead.axis_minimum.z - bz %}
  {% if safe_z > zmax or pause.work_z < zmin or pause.work_z > zmax %}
    {action_raise_error("Ordered resume lacks Z travel for safe clearance; check tool zero")}
  {% endif %}
  M220 S100
  G90
  G1 Z{safe_z} F300
  G1 X{tx} Y{ty} F1800
  G1 Z{pause.work_z} F120
  M400
  M220 S{pause.factor * 100.0}
  G1 F{pause.feed}
  {% if not pause.absolute %} G91 {% endif %}
  # Base RESUME now restores this same position, with no diagonal return.
  # Updating the saved state also preserves a new Z zero after a bit change.
  SAVE_GCODE_STATE NAME=PAUSE_STATE
  SET_GCODE_VARIABLE MACRO=PAUSE_BASE VARIABLE=valid VALUE=False
