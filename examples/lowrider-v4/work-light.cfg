# Reference only: review hardware, macro conflicts and paths before enabling.
# LowRider work light and energized-stepper idle reminder.
# Automatic warning: 30-minute timeout, three 100 ms flashes,
# then one second steady. LED writes use SYNC=0 to avoid faking motion.
[led work_lights]
white_pin: P2.7
cycle_time: 0.010
initial_WHITE: 0.0

[save_variables]
filename: ~/printer_data/config/lowrider_ui_variables.cfg

[gcode_macro _LED_IDLE_STATE]
variable_automatic: 0
variable_idle_since: -1.0
variable_last_move: -1.0
variable_snooze_until: 0.0
variable_steady: 0.0
variable_timeout: 1800.0
variable_phase: 0
variable_warning_since: -1.0
variable_disable_after: 1800.0
variable_shutdown_minutes: 30.0
gcode:
    # State container only.

[gcode_macro _LED_WARNING_STOP]
gcode:
    {% set s = printer['gcode_macro _LED_IDLE_STATE'] %}
    SET_GCODE_VARIABLE MACRO=_LED_IDLE_STATE VARIABLE=automatic VALUE=0
    SET_GCODE_VARIABLE MACRO=_LED_IDLE_STATE VARIABLE=warning_since VALUE=-1
    UPDATE_DELAYED_GCODE ID=led_warning_tick DURATION=0
    {% if s.automatic|int == 1 %}
        SET_LED LED=work_lights WHITE={s.steady|float} SYNC=0
    {% endif %}

[gcode_macro LED_IDLE_ACTIVITY]
description: Reset the energized-stepper idle reminder after dashboard activity
gcode:
    _LED_WARNING_STOP
    SET_GCODE_VARIABLE MACRO=_LED_IDLE_STATE VARIABLE=idle_since VALUE=-1

[gcode_macro LED_IDLE_SNOOZE]
description: Snooze the automatic idle warning for fifteen minutes
gcode:
    {% set now = printer.toolhead.estimated_print_time|float %}
    _LED_WARNING_STOP
    SET_GCODE_VARIABLE MACRO=_LED_IDLE_STATE VARIABLE=snooze_until VALUE={now + 900.0}
    SET_GCODE_VARIABLE MACRO=_LED_IDLE_STATE VARIABLE=idle_since VALUE={now - printer['gcode_macro _LED_IDLE_STATE'].timeout|float}

[gcode_macro SET_STEPPER_TIMEOUT]
description: Set idle reminder and stepper-disable grace minutes; ENABLE=0 disables automatic stepper disable
gcode:
    {% set s = printer['gcode_macro _LED_IDLE_STATE'] %}
    {% set minutes = params.MINUTES|default(s.shutdown_minutes)|float %}
    {% set enabled = params.ENABLE|default(1)|int %}
    {% set warning = params.WARNING_MINUTES|default(s.timeout|float / 60.0)|float %}
    {% if not (minutes >= 1 and minutes <= 1440) or not (warning >= 1 and warning <= 1440) or enabled not in [0,1] %}
        {action_raise_error('Timeout must be 1 to 1440 minutes; ENABLE must be 0 or 1')}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_LED_IDLE_STATE VARIABLE=timeout VALUE={warning * 60.0}
    SET_GCODE_VARIABLE MACRO=_LED_IDLE_STATE VARIABLE=shutdown_minutes VALUE={minutes}
    SET_GCODE_VARIABLE MACRO=_LED_IDLE_STATE VARIABLE=disable_after VALUE={minutes * 60.0 if enabled else 0.0}
    SAVE_VARIABLE VARIABLE=cnc_idle_warning_minutes VALUE={warning}
    SAVE_VARIABLE VARIABLE=cnc_stepper_timeout_minutes VALUE={minutes}
    SAVE_VARIABLE VARIABLE=cnc_stepper_auto_disable VALUE={enabled}
    LED_IDLE_ACTIVITY

[delayed_gcode led_restore_settings]
initial_duration: 0.5
gcode:
    {% set saved = printer.save_variables.variables %}
    {% set minutes = saved.cnc_stepper_timeout_minutes|default(30.0)|float %}
    {% set enabled = saved.cnc_stepper_auto_disable|default(1)|int %}
    {% set warning = saved.cnc_idle_warning_minutes|default(30.0)|float %}
    SET_GCODE_VARIABLE MACRO=_LED_IDLE_STATE VARIABLE=timeout VALUE={warning * 60.0}
    SET_GCODE_VARIABLE MACRO=_LED_IDLE_STATE VARIABLE=shutdown_minutes VALUE={minutes}
    SET_GCODE_VARIABLE MACRO=_LED_IDLE_STATE VARIABLE=disable_after VALUE={minutes * 60.0 if enabled else 0.0}

[gcode_macro LED_SET_BRIGHTNESS]
description: Set steady work-light brightness in percent
gcode:
    {% set percent = params.PERCENT|default(70)|float %}
    {% if percent < 0 or percent > 100 %}
        {action_raise_error('Brightness must be between 0 and 100 percent')}
    {% endif %}
    _LED_WARNING_STOP
    SET_GCODE_VARIABLE MACRO=LED_BREATHE VARIABLE=enabled VALUE=0
    UPDATE_DELAYED_GCODE ID=led_breathe_tick DURATION=0
    SET_GCODE_VARIABLE MACRO=_LED_IDLE_STATE VARIABLE=steady VALUE={percent / 100.0}
    SET_GCODE_VARIABLE MACRO=_LED_IDLE_STATE VARIABLE=idle_since VALUE=-1
    SET_LED LED=work_lights WHITE={percent / 100.0} SYNC=0

[gcode_macro LED_ON]
description: Turn the work light on at 70 percent
gcode:
    LED_SET_BRIGHTNESS PERCENT=70

[gcode_macro LED_OFF]
description: Turn the work light off
gcode:
    LED_SET_BRIGHTNESS PERCENT=0

[gcode_macro LED_BREATHE]
description: Start optional manual breathing (separate from the idle warning)
variable_enabled: 0
variable_level: 0.25
variable_direction: 1
gcode:
    LED_IDLE_ACTIVITY
    SET_GCODE_VARIABLE MACRO=LED_BREATHE VARIABLE=enabled VALUE=1
    SET_GCODE_VARIABLE MACRO=LED_BREATHE VARIABLE=level VALUE=0.25
    SET_GCODE_VARIABLE MACRO=LED_BREATHE VARIABLE=direction VALUE=1
    UPDATE_DELAYED_GCODE ID=led_breathe_tick DURATION=0.01

[gcode_macro LED_BREATHE_STOP]
description: Stop manual breathing and restore the selected steady brightness
gcode:
    {% set s = printer['gcode_macro _LED_IDLE_STATE'] %}
    LED_SET_BRIGHTNESS PERCENT={s.steady|float * 100.0}

[delayed_gcode led_breathe_tick]
gcode:
    {% set b = printer['gcode_macro LED_BREATHE'] %}
    {% set s = printer['gcode_macro _LED_IDLE_STATE'] %}
    {% if b.enabled|int == 1 %}
        {% if s.automatic|int == 0 %}
            SET_LED LED=work_lights WHITE={b.level|float} SYNC=0
        {% endif %}
        {% set level = b.level|float + 0.025 * b.direction|int %}
        {% if level >= 1.0 %}
            SET_GCODE_VARIABLE MACRO=LED_BREATHE VARIABLE=level VALUE=1.0
            SET_GCODE_VARIABLE MACRO=LED_BREATHE VARIABLE=direction VALUE=-1
        {% elif level <= 0.05 %}
            SET_GCODE_VARIABLE MACRO=LED_BREATHE VARIABLE=level VALUE=0.05
            SET_GCODE_VARIABLE MACRO=LED_BREATHE VARIABLE=direction VALUE=1
        {% else %}
            SET_GCODE_VARIABLE MACRO=LED_BREATHE VARIABLE=level VALUE={level}
        {% endif %}
        UPDATE_DELAYED_GCODE ID=led_breathe_tick DURATION=0.05
    {% endif %}

[delayed_gcode led_warning_tick]
gcode:
    {% set s = printer['gcode_macro _LED_IDLE_STATE'] %}
    {% if s.automatic|int == 1 %}
        {% set phase = s.phase|int %}
        {% if phase < 6 %}
            SET_LED LED=work_lights WHITE={1.0 if phase % 2 == 0 else 0.0} SYNC=0
            SET_GCODE_VARIABLE MACRO=_LED_IDLE_STATE VARIABLE=phase VALUE={phase + 1}
            UPDATE_DELAYED_GCODE ID=led_warning_tick DURATION=0.10
        {% else %}
            SET_LED LED=work_lights WHITE={s.steady|float} SYNC=0
            SET_GCODE_VARIABLE MACRO=_LED_IDLE_STATE VARIABLE=phase VALUE=0
            UPDATE_DELAYED_GCODE ID=led_warning_tick DURATION=1.0
        {% endif %}
    {% endif %}

[delayed_gcode led_idle_watch]
initial_duration: 1.0
gcode:
    {% set s = printer['gcode_macro _LED_IDLE_STATE'] %}
    {% set now = printer.toolhead.estimated_print_time|float %}
    {% set move = printer.toolhead.print_time|float %}
    {% set energized = printer.stepper_enable.steppers.values()|select|list|length > 0 %}
    {% set busy = printer.idle_timeout.state == 'Printing' or printer.print_stats.state == 'printing' %}
    {% set paused = printer.print_stats.state == 'paused' or printer.pause_resume.is_paused %}
    {% set moved = move != s.last_move|float %}
    SET_GCODE_VARIABLE MACRO=_LED_IDLE_STATE VARIABLE=last_move VALUE={move}
    {% if busy or moved or not energized or s.steady|float <= 0 %}
        _LED_WARNING_STOP
        SET_GCODE_VARIABLE MACRO=_LED_IDLE_STATE VARIABLE=idle_since VALUE=-1
    {% elif now < s.snooze_until|float %}
        _LED_WARNING_STOP
        SET_GCODE_VARIABLE MACRO=_LED_IDLE_STATE VARIABLE=idle_since VALUE={now - s.timeout|float}
    {% elif s.automatic|int == 0 %}
        {% if s.idle_since|float < 0 %}
            SET_GCODE_VARIABLE MACRO=_LED_IDLE_STATE VARIABLE=idle_since VALUE={now}
        {% elif now - s.idle_since|float >= s.timeout|float %}
            SET_GCODE_VARIABLE MACRO=_LED_IDLE_STATE VARIABLE=automatic VALUE=1
            SET_GCODE_VARIABLE MACRO=_LED_IDLE_STATE VARIABLE=warning_since VALUE={now}
            SET_GCODE_VARIABLE MACRO=_LED_IDLE_STATE VARIABLE=phase VALUE=0
            UPDATE_DELAYED_GCODE ID=led_warning_tick DURATION=0.01
        {% endif %}
    {% elif paused %}
        # Keep the lamp reminder but never disable during a paused job.
        SET_GCODE_VARIABLE MACRO=_LED_IDLE_STATE VARIABLE=warning_since VALUE={now}
    {% elif s.disable_after|float > 0 and s.warning_since|float >= 0 and now - s.warning_since|float >= s.disable_after|float %}
        _LED_WARNING_STOP
        M84
        SET_GCODE_VARIABLE MACRO=_LED_IDLE_STATE VARIABLE=idle_since VALUE=-1
        {action_respond_info('Steppers disabled after the configured idle warning timeout. Home again and recheck work zeros.')}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=led_idle_watch DURATION=1.0
