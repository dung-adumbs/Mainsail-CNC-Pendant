# Owner-specific white work-light integration. Include after existing lighting.
# Requires existing work_lights, LED_BREATHE, _LED_IDLE_STATE and their timers.
# Rapid warning temporarily suspends other lamp animations; never moves axes.
[gcode_macro CNC_HEALTH_LIGHT]
variable_active: 0
variable_phase: 0
gcode:
    {% set on = params.ACTIVE|default(0)|int %}
    {% if on %}
        SET_GCODE_VARIABLE MACRO=CNC_HEALTH_LIGHT VARIABLE=active VALUE=1
        SET_GCODE_VARIABLE MACRO=CNC_HEALTH_LIGHT VARIABLE=phase VALUE=0
        UPDATE_DELAYED_GCODE ID=led_breathe_tick DURATION=0
        UPDATE_DELAYED_GCODE ID=led_warning_tick DURATION=0
        UPDATE_DELAYED_GCODE ID=cnc_health_light_tick DURATION=0.01
    {% else %}
        SET_GCODE_VARIABLE MACRO=CNC_HEALTH_LIGHT VARIABLE=active VALUE=0
        UPDATE_DELAYED_GCODE ID=cnc_health_light_tick DURATION=0
        {% if printer['gcode_macro _LED_IDLE_STATE'].automatic|int %}
            UPDATE_DELAYED_GCODE ID=led_warning_tick DURATION=0.01
        {% elif printer['gcode_macro LED_BREATHE'].enabled|int %}
            UPDATE_DELAYED_GCODE ID=led_breathe_tick DURATION=0.05
        {% else %}
            SET_LED LED=work_lights WHITE={printer['gcode_macro _LED_IDLE_STATE'].steady|float} SYNC=0
        {% endif %}
    {% endif %}

[delayed_gcode cnc_health_light_tick]
gcode:
    {% set h = printer['gcode_macro CNC_HEALTH_LIGHT'] %}
    {% if h.active|int %}
        UPDATE_DELAYED_GCODE ID=led_breathe_tick DURATION=0
        UPDATE_DELAYED_GCODE ID=led_warning_tick DURATION=0
        SET_LED LED=work_lights WHITE={1.0 if h.phase|int == 0 else 0.0} SYNC=0
        SET_GCODE_VARIABLE MACRO=CNC_HEALTH_LIGHT VARIABLE=phase VALUE={1 - h.phase|int}
        UPDATE_DELAYED_GCODE ID=cnc_health_light_tick DURATION=0.15
    {% endif %}
